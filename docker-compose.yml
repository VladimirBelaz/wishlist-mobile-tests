services:
  wiremock:
    container_name: wiremock
    image: wiremock/wiremock:3.13.2
    volumes:
      - ./wiremock:/home/wiremock:ro
    # порт 8080 на хост не пробрасываем – эмуляторы обращаются по имени внутри сети

  android-1:
    container_name: android-1
    image: budtmo/docker-android:emulator_12.0_v3.6.0-p0   # фиксированная версия Appium
    ports:
      - "6080:6080"
      - "4723:4723"
    environment:
      WEB_VNC: "true"
      APPIUM: "true"
    devices:
      - "/dev/kvm"

  android-2:
    container_name: android-2
    image: budtmo/docker-android:emulator_14.0_v3.6.0-p0   # фиксированная версия Appium
    ports:
      - "6081:6080"
      - "4724:4723"
    environment:
      WEB_VNC: "true"
      APPIUM: "true"
    devices:
      - "/dev/kvm"